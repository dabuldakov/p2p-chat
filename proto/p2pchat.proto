syntax = "proto3";

package p2pchat.v1;

// Опции только для генерации Java/Kotlin (Rust prost их игнорирует).
option java_package = "com.p2pchat.proto";
option java_outer_classname = "P2pchatProto";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Envelope — то, что реально летит по сети между узлами.
// payload всегда зашифрован групповым sender-key (для group-трафика) или
// попарным ключом (для прямых управляющих сообщений).
// ---------------------------------------------------------------------------
message Envelope {
  bytes sender = 1;        // публичный ключ / peer_id отправителя
  uint64 nonce = 2;        // защита от повторов
  bytes payload = 3;       // зашифрованный Gossip (см. ниже)
  bytes signature = 4;     // подпись отправителя над payload (Ed25519)
  uint64 lamport = 5;      // логические часы отправителя
}

// ---------------------------------------------------------------------------
// Чат
// ---------------------------------------------------------------------------
message ChatMessage {
  bytes id = 1;            // SHA-256 от содержимого (контент-адресация)
  bytes group_id = 2;      // идентификатор группы
  bytes author = 3;        // peer_id автора
  uint64 lamport = 4;      // логическое время (порядок CRDT)
  uint64 wall_time = 5;    // реальное время (для отображения)
  string text = 6;         // полезная нагрузка
  repeated bytes parents = 7; // причинные родители (DAG, как в SSB)
  Attachment attachment = 8;  // необязательное вложение (гифка)
}

// Вложение сообщения. Для гифок между клиентами едут только ссылки-идентификаторы
// (kind + id), а не байты медиа: каждый клиент сам тянет их с CDN провайдера.
message Attachment {
  string kind = 1;     // провайдер, напр. "klipy" (на будущее: "url")
  string id = 2;       // id/slug у провайдера
  uint32 width = 3;    // для резерва места до загрузки
  uint32 height = 4;
  string url = 5;      // для прямых url-вложений (у klipy пусто)
}

// ---------------------------------------------------------------------------
// Обнаружение узлов
// ---------------------------------------------------------------------------
enum Transport {
  TRANSPORT_UNKNOWN = 0;
  TRANSPORT_UDP = 1;
  TRANSPORT_TCP = 2;
  TRANSPORT_WEBRTC = 3;
  TRANSPORT_TURN = 4;
}

message Endpoint {
  string host = 1;
  uint32 port = 2;
  Transport transport = 3;
}

message PeerInfo {
  bytes peer_id = 1;
  repeated Endpoint endpoints = 2;
  uint64 last_seen = 3;    // unix-время последней активности
  bool is_relay = 4;       // узел с публичным IP / всегда онлайн
  uint32 hops = 5;         // на каком расстоянии узнали
}

message PeerList {
  repeated PeerInfo peers = 1;
  uint64 version = 2;      // монотонная версия (LWW-merge)
}

// ---------------------------------------------------------------------------
// Анти-энтропия: обмен недостающими сообщениями
// ---------------------------------------------------------------------------
message SyncRequest {
  bytes group_id = 1;
  repeated bytes have_heads = 2;  // головы DAG, которые у нас есть
  uint64 lamport_watermark = 3;   // всё, что новее — пришли
}

message SyncResponse {
  repeated ChatMessage messages = 1;
  repeated PeerInfo peers = 2;
  bool more = 3;           // есть ли ещё (постранично)
}

// Merkle-digest: сравнить корни деревьев, чтобы понять, нужен ли синк вообще.
message SyncDigest {
  bytes group_id = 1;
  bytes root = 2;          // Merkle-корень над отсортированными id
  uint64 count = 3;        // сколько сообщений в группе
}

// Полный список id группы — обмен для вычисления расхождений.
message SyncIds {
  bytes group_id = 1;
  repeated bytes ids = 2;
}

// Запрос конкретных сообщений по id.
message SyncFetch {
  bytes group_id = 1;
  repeated bytes ids = 2;
}

// ---------------------------------------------------------------------------
// Единый конверт полезной нагрузки (кладётся в Envelope.payload)
// ---------------------------------------------------------------------------
// Зашифрованное групповое сообщение. Внутри — сериализованный ChatMessage.
message Encrypted {
  bytes group_id = 1;
  bytes nonce = 2;
  bytes ciphertext = 3;
}

message Gossip {
  oneof body {
    ChatMessage message = 1;
    PeerList peer_list = 2;
    SyncRequest sync_request = 3;
    SyncResponse sync_response = 4;
    Presence presence = 5;
    SyncDigest sync_digest = 6;
    SyncIds sync_ids = 7;
    SyncFetch sync_fetch = 8;
    Encrypted encrypted = 9;
    MembershipEvent membership = 10;
    Direct direct = 11;
    ProfileEvent profile = 12;
    Mls mls = 13;
    Links links = 14;
    GroupProfile group_profile = 15;
    EditEvent edit = 16;
    DeleteEvent delete = 17;
    LeaveEvent leave = 18;
    OwnerAlive owner_alive = 19;
    OwnerClaim owner_claim = 20;
    OwnerVote owner_vote = 21;
    OwnerChange owner_change = 22;
  }
}

// Правка сообщения. Само сообщение неизменяемо (контент-адресация); правка —
// отдельное событие, ссылающееся на исходное. Правит только автор, LWW.
// Выход участника. Подписан уходящим; владелец (или новый владелец, если
// уходит сам владелец) делает MLS Remove и рассылает Commit.
message LeaveEvent {
  bytes group_id = 1;
  bytes peer_id = 2;        // кто уходит (== author)
  bytes new_owner = 3;      // новый владелец, если уходит владелец (иначе пусто)
  uint64 lamport = 4;
  uint64 wall_time = 5;
  bytes author = 6;
}

// Удаление сообщения (tombstone). Правит только автор исходного, событие
// необратимо и не зависит от порядка (как только пришло — удалено).
message DeleteEvent {
  bytes group_id = 1;
  bytes target_id = 2;
  uint64 lamport = 3;
  uint64 wall_time = 4;
  bytes author = 5;
}

message EditEvent {
  bytes group_id = 1;
  bytes target_id = 2;     // id исходного сообщения
  string text = 3;         // новый текст
  uint64 lamport = 4;
  uint64 wall_time = 5;
  bytes author = 6;        // автор (должен совпадать с автором исходного)
}

// Аватар группы (меняет владелец). Эфемерный контрольный месседж, не в лог.
message GroupProfile {
  bytes group_id = 1;
  bytes avatar = 2;         // маленькое изображение (напр. 128×128 JPEG)
  uint64 lamport = 3;
  bytes author = 4;
  bytes id = 5;
  string name = 6;          // имя группы (меняется только владельцем)
}

// Одна связь: с кем и как подключены.
message Link {
  bytes peer_id = 1;
  string kind = 2;          // "direct" | "turn"
}

// Служебное ЭФЕМЕРНОЕ сообщение: «мои активные связи» в группе.
// Рассылается раз в минуту, НЕ пишется в лог (как Presence).
message Links {
  bytes group_id = 1;
  bytes peer_id = 2;             // автор (кто публикует)
  uint64 time = 3;               // unix-время публикации
  repeated Link links = 4;       // с кем соединён и как
}

// Сообщение MLS (RFC 9420): прикладное или handshake (Commit/Welcome/Proposal).
// `group_id` — для маршрутизации к нужной группе; `message` — сериализованный
// MlsMessageOut. Само шифрование/аутентификация — внутри MLS.
message Mls {
  bytes group_id = 1;
  bytes message = 2;
}

// Сервисные сообщения впуска, которые едут ПОПАРНО (шифруются X25519).
message Pairwise {
  oneof body {
    JoinRequest join_request = 1;   // новичок → хозяин: билет + KeyPackage
    JoinWelcome join_welcome = 2;   // хозяин → новичок: Welcome
  }
}

// Заявка на вход: одноразовый подписанный билет + KeyPackage новичка.
message JoinRequest {
  bytes group_id = 1;
  string ticket = 2;
  bytes key_package = 3;
}

// Ответ: Welcome для входа в MLS-группу.
message JoinWelcome {
  bytes group_id = 1;
  bytes welcome = 2;
}

// Профиль участника (никнейм). Реплицируется по сети, LWW по lamport —
// как события членства. У кого задан ник — показываем его, иначе идентификатор.
message ProfileEvent {
  bytes peer_id = 1;
  string nickname = 2;
  uint64 lamport = 3;
  bytes author = 4;
  bytes id = 5;
  bytes avatar = 6;        // маленькое изображение (128×128 JPEG), пусто = нет
}

// Прямое (попарно зашифрованное) сообщение конкретному участнику.
// Нужно для rekey: доставка нового группового ключа оставшимся
// (шифруется ключом X25519(наш секрет, публичный ключ получателя)).
message Direct {
  bytes to = 1;            // публичный ключ получателя
  bytes nonce = 2;
  bytes ciphertext = 3;    // [group_id || 32-byte key], ChaCha20-Poly1305
}

// Событие членства группы. Реплицируется по сети; состав группы —
// это CRDT-множество: побеждает более позднее событие (по lamport).
message MembershipEvent {
  bytes group_id = 1;
  bytes peer_id = 2;       // кто участник
  bytes public_key = 3;    // его публичный ключ (нужен для соединения)
  bool join = 4;           // true — вход, false — выход
  uint64 lamport = 5;      // разрешение конфликтов
  bytes author = 6;        // кто подписал событие
  bytes id = 7;            // контент-хеш события
}

message Presence {
  bytes peer_id = 1;
  bool online = 2;
  uint64 since = 3;
}

// ---------------------------------------------------------------------------
// Signaling — обмен через инфраструктурный сервер (WebSocket) для установки
// WebRTC-соединения. Сам чат через него не идёт.
// ---------------------------------------------------------------------------
message SignalEnvelope {
  bytes from = 1;          // публичный ключ отправителя
  bytes to = 2;            // публичный ключ получателя (для маршрутизации)
  oneof body {
    Register register = 3;
    Offer offer = 4;
    Answer answer = 5;
    IceCandidate ice = 6;
  }
}

message Register {
  bytes peer_id = 1;
  repeated Endpoint endpoints = 2;  // куда до нас достучаться напрямую
  bool is_relay = 3;
}

message Offer {
  bytes sdp = 1;           // сериализованный SDP
  string session_id = 2;
}

message Answer {
  bytes sdp = 1;
  string session_id = 2;
}

message IceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  uint32 sdp_mline_index = 3;
}
// Жалоба (отправляется на сервер по HTTPS, не в gossip).
message Report {
  bytes reporter_key = 1;   // публичный ключ Ed25519 отправителя
  bytes reported_peer = 2;  // peer_id нарушителя
  bytes group_id = 3;
  bytes message_id = 4;     // пусто, если жалоба на профиль
  string reason = 5;        // spam | abuse | illegal | other
  string note = 6;
  bytes screenshot = 7;     // JPEG (опционально)
  uint64 timestamp = 8;     // unix seconds
  bytes nonce = 9;          // 16 байт
}

// Владелец жив: периодический heartbeat (обновляет last_seen владельца).
message OwnerAlive {
  bytes group_id = 1;
  bytes owner = 2;          // должен совпадать с владельцем и отправителем
  uint64 at = 3;            // unix seconds
}

enum OwnerTrigger {
  OWNER_TRIGGER_ABSENT = 0;
  OWNER_TRIGGER_CHALLENGE = 1;
  OWNER_TRIGGER_AUTO = 2;
}

// Кандидат на владение (заявка).
message OwnerClaim {
  bytes group_id = 1;
  bytes claim_id = 2;        // SHA-256 канонических байтов заявки
  bytes claimant = 3;        // peer_id
  bytes claimant_key = 4;    // публичный ключ (content_id == claimant)
  OwnerTrigger trigger = 5;
  uint64 last_seen_owner = 6;
  uint64 created_at = 7;
  bytes nonce = 8;
  bytes sig = 9;             // подпись claimant
}

// Голос участника за конкретную заявку (или «оставить владельца»).
message OwnerVote {
  bytes group_id = 1;
  bytes claim_id = 2;        // пусто, если keep
  bytes voter = 3;
  bytes voter_key = 4;
  bool approve = 5;
  bool keep = 6;
  uint64 at = 7;
  bytes sig = 8;             // подпись voter
}

// Итог выборов: заявка + голоса (с подписями). Может рассылать любой участник.
message OwnerChange {
  bytes group_id = 1;
  OwnerClaim claim = 2;       // победившая заявка
  repeated OwnerVote votes = 3;
  bytes new_owner = 4;
  uint64 at = 5;
  uint64 epoch = 6;
  repeated OwnerClaim candidates = 7; // все заявки выборов (для проверки кворума)
}

// Локальное состояние активных выборов (persist в meta, не пересылается).
message OwnerElectionState {
  bytes group_id = 1;
  OwnerTrigger trigger = 2;
  uint64 created_at = 3;
  repeated OwnerClaim claims = 4;
  repeated OwnerVote votes = 5;
}
