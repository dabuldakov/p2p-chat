[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/crypto",
    "crates/storage",
    "crates/transport",
    "crates/signaling",
    "crates/server",
    "crates/ffi",
    "crates/node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["p2pchat contributors"]

[workspace.dependencies]
# local crates
p2pchat-proto = { path = "crates/proto" }
p2pchat-core = { path = "crates/core" }
p2pchat-crypto = { path = "crates/crypto" }
p2pchat-storage = { path = "crates/storage" }
p2pchat-transport = { path = "crates/transport" }
p2pchat-signaling = { path = "crates/signaling" }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }

# serialization
prost = "0.13"
prost-types = "0.13"
bytes = "1"

# crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ffi
uniffi = "0.28"

# websockets (signaling)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# TURN REST API (временные креды)
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"