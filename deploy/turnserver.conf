# coturn — STUN/TURN для WebRTC в сотовых сетях (CGNAT).
#
# Развёрнут на 90.188.89.63 (см. deploy/deploy-turn.sh).
# Сервер за 1:1 NAT: интерфейс 192.168.1.8, публичный 90.188.89.63 —
# поэтому обязательно external-ip и явные listening-ip/relay-ip.

# Слушаем только LAN-интерфейс (иначе coturn подхватит docker/wg бриджи).
listening-ip=192.168.1.8
relay-ip=192.168.1.8

# Публичный адрес: external-ip=ПУБЛИЧНЫЙ/ЛОКАЛЬНЫЙ
external-ip=90.188.89.63/192.168.1.8

listening-port=3478
fingerprint
lt-cred-mech
realm=p2pchat

# Учётка. Для продакшена — временные креды через REST API (turn_rest_api).
user=p2pchat:CHANGE_ME_STRONG_SECRET

min-port=49152
max-port=65535

no-multicast-peers
no-cli