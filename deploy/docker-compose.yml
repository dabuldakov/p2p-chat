# docker compose up -d
#
# signaling  — WebSocket-сервер знакомств (порт 8080)
# coturn     — STUN/TURN (порты 3478/udp, 3478/tcp, 5349, 49152-65535/udp)
#
# Запускать из каталога deploy/ (контекст сборки — родительский репозиторий).

services:
  signaling:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: p2pchat-signal:latest
    restart: unless-stopped
    ports:
      - "8080:8080"

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
