name: android

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'store/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core for Android
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o android/app/src/main/jniLibs build -p p2pchat-ffi --release

      - name: Regenerate Kotlin bindings (UniFFI)
        run: |
          cargo build -p p2pchat-ffi
          cargo run -p p2pchat-ffi --bin uniffi-bindgen -- generate \
            --library target/debug/libp2pchat_ffi.so \
            --language kotlin --out-dir android/app/src/main/java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APKs
        working-directory: android
        env:
          SIGNAL_URL: ${{ secrets.SIGNAL_URL }}
          TURN_CREDS_URL: ${{ secrets.TURN_CREDS_URL }}
          KLIPY_APP_KEY: ${{ secrets.KLIPY_APP_KEY }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.have == 'true' && format('{0}/android/app/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Build Play AAB
        working-directory: android
        env:
          PLAY_BUILD: "true"
          SIGNAL_URL: ${{ secrets.SIGNAL_URL }}
          TURN_CREDS_URL: ${{ secrets.TURN_CREDS_URL }}
          KLIPY_APP_KEY: ${{ secrets.KLIPY_APP_KEY }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.have == 'true' && format('{0}/android/app/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Rename APKs with version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/p2p-chat-${VERSION}.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/p2p-chat-${VERSION}-debug.apk"
          mv android/app/build/outputs/bundle/release/app-release.aab "android/app/build/outputs/bundle/release/p2p-chat-${VERSION}.aab"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: p2pchat-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: p2pchat-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload release AAB (для Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: p2pchat-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release body (changelog)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PREV="$(gh release view --json body --jq '.body' 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1 || true)"
          if [ -n "$PREV" ] && git cat-file -e "$PREV" 2>/dev/null; then
            RANGE="$PREV..HEAD"
          else
            RANGE="-n 40"
          fi
          {
            echo "Версия: $VERSION"
            echo "Коммит: ${{ github.sha }}"
            echo
            echo "## Что нового"
            echo
            git log --pretty=tformat:'%s' $RANGE | bash .github/scripts/changelog.sh
          } > release_body.md
          echo "----- release_body.md -----"
          cat release_body.md

      - name: Publish latest release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: p2pchat ${{ steps.ver.outputs.version }}
          body_path: release_body.md
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/p2p-chat-*.apk